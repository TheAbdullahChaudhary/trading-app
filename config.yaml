bot:
  name: "MEXC Scalping AI Bot"
  version: "2.0.0"
  dry_run: true        # DEMO MODE - $100 paper trading
  log_level: "INFO"
  auto_restart: true   # Auto-restart on errors

mexc:
  base_url: "https://contract.mexc.com"
  ws_url: "wss://contract.mexc.com/edge"
  recv_window: 5000

symbols:
  - name: "BTC_USDT"
    display: "Bitcoin"
    leverage: 15
    min_size: 1
  - name: "ETH_USDT"
    display: "Ethereum"
    leverage: 15
    min_size: 1
  - name: "XAUT_USDT"
    display: "Gold"
    leverage: 15
    min_size: 1
  - name: "SILVER_USDT"
    display: "Silver"
    leverage: 15
    min_size: 1
  - name: "USOIL_USDT"
    display: "Crude Oil"
    leverage: 15
    min_size: 1

trading:
  timeframe: "Min1"          # 1-minute candles for scalping
  htf_timeframe: "Min5"      # Higher timeframe for trend filter
  lookback_candles: 300      # candles for indicator calculation
  signal_check_interval: 3   # check every 3 seconds (faster updates)
  min_volume_usdt: 0         # min candle volume filter (0 = disabled)

risk:
  risk_per_trade_pct: 2.0    # 2% per trade - aggressive but controlled
  max_open_positions: 2      # max 2 positions - more opportunities
  max_daily_drawdown_pct: 5.0  # stop at 5% loss
  sl_atr_multiplier: 1.5     # Tighter SL
  tp_atr_multiplier: 4.5     # Better R:R (1:3)
  max_trades_per_hour: 5     # max 5 trades/hour
  cooldown_seconds: 180      # 3min between trades

ai:
  retrain_interval_hours: 4   # retrain every 4h - adapt faster
  min_confidence: 0.70        # 70% confidence minimum - HIGH accuracy
  lookback_for_training: 250

dashboard:
  host: "0.0.0.0"
  port: 5000
  debug: false
